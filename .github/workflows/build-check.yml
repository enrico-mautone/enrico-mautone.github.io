name: "Build check (branches)"
# Builds and tests the site on any branch except main, without deploying.
# Useful to validate changes before merging into main.
on:
  push:
    branches-ignore:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build site
        run: |
          set -o pipefail
          if ! bundle exec jekyll b --trace -d "_site" 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            # Surface the error as an annotation (readable from the API without downloading logs)
            msg=$(grep -v '^\s*$' "$RUNNER_TEMP/build.log" | grep -v '^\s*from ' | tail -25 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Jekyll build failed::${msg}"
            exit 1
          fi
        env:
          JEKYLL_ENV: "production"

      - name: Upload built site (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 3

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Check multilingual output
        run: |
          set -e
          IT=_site/posts/the-orchestrator-not-the-coder/index.html
          EN=_site/en/posts/the-orchestrator-not-the-coder/index.html
          FB=_site/en/posts/ma-tu-quanto-sei-maturo/index.html
          test -f _site/en/index.html
          grep -q '<html lang="en"' _site/en/index.html
          grep -q 'The orchestrator, not the coder' "$EN"
          grep -q 'hreflang="en" href="https://enrico-mautone.github.io/en/posts/the-orchestrator-not-the-coder/"' "$IT"
          grep -q 'Read in English' "$IT"
          grep -q 'Leggi in italiano' "$EN"
          ! grep -q 'noindex' "$EN"
          grep -q 'noindex' "$FB"
          ! grep -q 'noindex' "$IT"
          grep -q 'orchestrator-not-the-coder' _site/en/feed.xml
          ! grep -q '/en/posts/' _site/feed.xml
          grep -q 'START HERE' _site/en/index.html
          echo "Multilingual output OK"
