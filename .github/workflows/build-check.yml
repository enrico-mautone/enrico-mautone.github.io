name: "Build check (branches)"
# Builds and tests the site on any branch except main, without deploying.
# Useful to validate changes before merging into main.
on:
  push:
    branches-ignore:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build site
        run: |
          set -o pipefail
          if ! bundle exec jekyll b --trace -d "_site" 2>&1 | tee build.log; then
            # Surface the error as an annotation (readable from the API without downloading logs)
            msg=$(grep -v '^\s*$' build.log | grep -v '^\s*from ' | tail -25 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Jekyll build failed::${msg}"
            exit 1
          fi
        env:
          JEKYLL_ENV: "production"

      - name: Upload built site (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 3

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Check multilingual output
        run: |
          set -e
          test -f _site/en/index.html
          grep -q 'The orchestrator, not the coder' _site/en/posts/the-orchestrator-not-the-coder/index.html
          grep -q "L'orchestratore\|L&#39;orchestratore\|L’orchestratore" _site/posts/the-orchestrator-not-the-coder/index.html
          grep -q 'orchestrator-not-the-coder' _site/en/feed.xml
          ! grep -q '/en/posts/' _site/feed.xml
          echo "Multilingual output OK"

      - name: Report multilingual details
        if: always()
        run: |
          o() { echo "== $1"; grep -o "$2" "$3" 2>&1 | head -${4:-6} | cut -c1-220; }
          {
            o "html lang /" '<html lang="[^"]*"' _site/index.html
            o "html lang /en/" '<html lang="[^"]*"' _site/en/index.html
            o "switch /" 'lang-switch">.\{0,160\}' _site/index.html
            o "switch /en/" 'lang-switch">.\{0,160\}' _site/en/index.html
            o "switch /en/ on post" 'lang-switch">.\{0,160\}' _site/en/posts/the-orchestrator-not-the-coder/index.html
            o "head en orch" '<link rel="\(canonical\|alternate\)"[^>]*>' _site/en/posts/the-orchestrator-not-the-coder/index.html 8
            o "head it orch" '<link rel="\(canonical\|alternate\)"[^>]*>' _site/posts/the-orchestrator-not-the-coder/index.html 8
            o "head en fallback" '<link rel="\(canonical\|alternate\)"[^>]*>' _site/en/posts/ma-tu-quanto-sei-maturo/index.html 8
            o "langalt it orch" 'lang-alt-link.\{0,200\}' _site/posts/the-orchestrator-not-the-coder/index.html 2
            o "langalt en orch" 'lang-alt-link.\{0,200\}' _site/en/posts/the-orchestrator-not-the-coder/index.html 2
            o "langalt en fallback" 'lang-alt-link.\{0,200\}' _site/en/posts/ma-tu-quanto-sei-maturo/index.html 2
            o "post-meta en orch" 'post-meta.\{0,120\}' _site/en/posts/the-orchestrator-not-the-coder/index.html 1
            o "tabs en" 'nav-link">.\{0,80\}' _site/en/index.html 8
            o "home en titles" 'card-title[^>]*>[^<]*' _site/en/index.html 8
            o "home it titles" 'card-title[^>]*>[^<]*' _site/index.html 8
            o "feed it" '<title>[^<]*</title>' _site/feed.xml 8
            o "feed en" '<title>[^<]*</title>' _site/en/feed.xml 8
            echo "== en dirs"; ls _site/en | tr '\n' ' '; echo
            echo "== en categories"; ls _site/en/categories 2>&1 | tr '\n' ' '; echo
            echo "== en assets"; ls _site/en/assets 2>&1 | tr '\n' ' '; echo
            echo "== sitemap /en/ entries"; grep -c '/en/' _site/sitemap.xml
          } > report.txt
          split -l 40 report.txt part_
          for f in part_*; do
            msg=$(sed 's/%/%25/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=Multilingual report $f::${msg}"
          done
